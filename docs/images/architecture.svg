<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 1090" width="1720" height="1090" font-family="Poppins, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">WearWise system architecture</title>
<desc id="d">Sensors connect to the ESP32 patch over I2C and an analog ECG input. The patch streams to the phone app over encrypted Bluetooth LE, or optionally pinned TLS over Wi-Fi. The phone stores everything in an encrypted local database and uploads over HTTPS to a Supabase backend (Auth, Postgres with Row Level Security, Storage, Realtime), which can be local, Supabase Cloud or self-hosted. Researchers use the web dashboard, which reads shared data and live view, and installs patch firmware over USB.</desc>
