<text x="1155.0" y="782" font-size="12" font-weight="600" fill="#8A97A8" text-anchor="middle">INT1 (not read yet: polled at 50 Hz)</text>
<text x="1100" y="852" font-size="12" font-weight="400" fill="#5B6B82" text-anchor="start">One shared I²C bus: internal pull-ups are on;</text>
<text x="1100" y="868" font-size="12" font-weight="400" fill="#5B6B82" text-anchor="start">add 4.7 kΩ to 3V3 on SDA and SCL for long wires.</text>
<rect x="110" y="954" width="1530" height="66" rx="14" fill="#FFFFFF" stroke="#C9D3E0"/>
<circle cx="138" cy="978" r="7" fill="#D64545"/>
<text x="154" y="983" font-size="14" font-weight="600" fill="#1E2A3B" text-anchor="start">Power: ESP32 3V3 → VIN (or 3.3V) of every module · ESP32 GND → GND of every module (one common ground).</text>
<circle cx="138" cy="1002" r="7" fill="#1E2A3B"/>
<text x="154" y="1007" font-size="13" font-weight="400" fill="#5B6B82" text-anchor="start">Check each breakout accepts 3.3 V (most MAX3010x, MAX30205, MMA8452Q and AD8232 boards do). The board itself is powered over USB, or a battery / power bank.</text>
