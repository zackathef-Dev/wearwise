<text x="424" y="455" font-size="14" font-weight="700" fill="#2E9D5B" text-anchor="end">LO+</text>
<circle cx="440" cy="520" r="7" fill="#E6B84C" stroke="#8C6A1F" stroke-width="1.5"/>
<text x="424" y="525" font-size="14" font-weight="700" fill="#2E9D5B" text-anchor="end">LO−</text>
<text x="126" y="402" font-size="12" font-weight="400" fill="#5B6B82" text-anchor="start">ECG, 250 Hz. Detected at boot by</text>
<text x="126" y="418" font-size="12" font-weight="400" fill="#5B6B82" text-anchor="start">probing LO+ / LO−.</text>
<text x="126" y="578" font-size="12" font-weight="600" fill="#1E2A3B" text-anchor="start">Electrodes: RA · LA · RL (3.5 mm jack)</text>
<rect x="122" y="592" width="306" height="38" rx="8" fill="#FDECEC"/>
<text x="132" y="609" font-size="11" font-weight="700" fill="#D64545" text-anchor="start">Electrodes on a person: power the board</text>
<text x="132" y="623" font-size="11" font-weight="700" fill="#D64545" text-anchor="start">from a battery or power bank only</text>
<path d="M440,380 H690" fill="none" stroke="#E07B00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
