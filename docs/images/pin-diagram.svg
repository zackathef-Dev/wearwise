<path d="M110,324 a14,14 0 0 1 14,-14 h302 a14,14 0 0 1 14,14 v38 h-330 z" fill="#0F2747"/>
<text x="126" y="334" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">AD8232</text>
<text x="126" y="353" font-size="12" font-weight="400" fill="#A8BBD4" text-anchor="start">single-lead ECG front-end · 3.3 V</text>
<circle cx="440" cy="380" r="7" fill="#E6B84C" stroke="#8C6A1F" stroke-width="1.5"/>
<text x="424" y="385" font-size="14" font-weight="700" fill="#E07B00" text-anchor="end">OUTPUT</text>
