<text x="860.0" y="296" font-size="12" font-weight="400" fill="#3B4A5E" text-anchor="middle">4 MB flash</text>
<text x="860.0" y="190" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">ESP32 dev board</text>
<circle cx="690" cy="380" r="7" fill="#E6B84C" stroke="#8C6A1F" stroke-width="1.5"/>
<text x="708" y="378" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">GPIO34</text>
<text x="708" y="395" font-size="11" font-weight="400" fill="#A8BBD4" text-anchor="start">ADC1 ch 6 · input only</text>
<circle cx="690" cy="450" r="7" fill="#E6B84C" stroke="#8C6A1F" stroke-width="1.5"/>
<text x="708" y="448" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">GPIO32</text>
<text x="708" y="465" font-size="11" font-weight="400" fill="#A8BBD4" text-anchor="start">lead-off detect</text>
<circle cx="690" cy="520" r="7" fill="#E6B84C" stroke="#8C6A1F" stroke-width="1.5"/>
<text x="708" y="518" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">GPIO33</text>
<text x="708" y="535" font-size="11" font-weight="400" fill="#A8BBD4" text-anchor="start">lead-off detect</text>
<circle cx="1030" cy="380" r="7" fill="#E6B84C" stroke="#8C6A1F" stroke-width="1.5"/>
<text x="1012" y="378" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="end">GPIO21</text>
<text x="1012" y="395" font-size="11" font-weight="400" fill="#A8BBD4" text-anchor="end">I²C SDA · 400 kHz</text>
<circle cx="1030" cy="450" r="7" fill="#E6B84C" stroke="#8C6A1F" stroke-width="1.5"/>
<text x="1012" y="448" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="end">GPIO22</text>
<text x="1012" y="465" font-size="11" font-weight="400" fill="#A8BBD4" text-anchor="end">I²C SCL</text>
<circle cx="1030" cy="790" r="7" fill="#E6B84C" stroke="#8C6A1F" stroke-width="1.5"/>
<text x="1012" y="788" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="end">GPIO27</text>
<text x="1012" y="805" font-size="11" font-weight="400" fill="#A8BBD4" text-anchor="end">MMA8452Q INT1 (reserved)</text>
<rect x="730" y="564" width="260" height="84" rx="12" fill="#17385f" stroke="#2b5183"/>
<circle cx="766" cy="606" r="16" fill="#E8EEF5" stroke="#8E9AA8" stroke-width="2"/>
<text x="794" y="598" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start">BOOT button = GPIO0</text>
<text x="794" y="618" font-size="11" font-weight="400" fill="#A8BBD4" text-anchor="start">opens a 60 s pairing window,</text>
<text x="794" y="633" font-size="11" font-weight="400" fill="#A8BBD4" text-anchor="start">clears a pairing lock-out</text>
<rect x="730" y="664" width="260" height="72" rx="12" fill="none" stroke="#8A97A8" stroke-dasharray="6 5"/>
<text x="746" y="690" font-size="13" font-weight="700" fill="#C7D2DF" text-anchor="start">Reserved for a future SPI sensor</text>
<text x="746" y="712" font-size="12" font-weight="400" fill="#A8BBD4" text-anchor="start">GPIO18 SCK · 19 MISO · 23 MOSI</text>
