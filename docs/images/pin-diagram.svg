<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 1084" width="1720" height="1084" font-family="Poppins, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">WearWise pin diagram</title>
<desc id="d">ESP32 dev board wiring for firmware 0.9.6. AD8232 OUTPUT to GPIO34, LO+ to GPIO32, LO- to GPIO33. MAX30102, MAX30205 and MMA8452Q share the I2C bus: SDA on GPIO21, SCL on GPIO22. MMA8452Q INT1 to GPIO27 (reserved). GPIO18, 19 and 23 are reserved for a future SPI sensor. The BOOT button is GPIO0. Every module takes 3V3 and GND from the ESP32.</desc>
<rect width="1720" height="1084" rx="24" fill="#F4F6F9"/>
<text x="40" y="58" font-size="28" font-weight="700" fill="#0F2747" text-anchor="start">WearWise pin diagram</text>
<text x="40" y="86" font-size="15" font-weight="400" fill="#5B6B82" text-anchor="start">Standard wiring for firmware 0.9.6 (main/config/HardwareConfig.h) · wire by the GPIO label printed on the board: 30- and 38-pin boards place them differently</text>
<rect x="690" y="160" width="340" height="760" rx="22" fill="#0F2747"/>
<rect x="770" y="204" width="180" height="112" rx="8" fill="#B9C3CF" stroke="#8E9AA8"/>
