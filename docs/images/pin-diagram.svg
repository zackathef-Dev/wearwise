<text x="565.0" y="442" font-size="12" font-weight="600" fill="#2E9D5B" text-anchor="middle">lead-off +</text>
<text x="565.0" y="512" font-size="12" font-weight="600" fill="#2E9D5B" text-anchor="middle">lead-off −</text>
